server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; lets nginx start even if a backend is still booting
    resolver 127.0.0.11 valid=10s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ---------- API gateway: one origin, many services ----------
    location /api/auth/       { set $u http://auth-user-service:5001;     proxy_pass $u; }
    location /api/users/      { set $u http://auth-user-service:5001;     proxy_pass $u; }
    location /api/products    { set $u http://product-search-service:5002; proxy_pass $u; }
    location /api/categories  { set $u http://product-search-service:5002; proxy_pass $u; }
    location /api/payment/    { set $u http://payment-service:5003;       proxy_pass $u; }
    location /api/cart        { set $u http://cart-service:5004;          proxy_pass $u; }
    location /api/orders      { set $u http://order-service:5005;         proxy_pass $u; }

    # product images referenced as /assets/... are served by the frontend itself (public/assets)

    # ---------- SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
