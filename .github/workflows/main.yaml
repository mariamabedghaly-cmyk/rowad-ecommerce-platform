
name: rowad-graduation-project

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth-user-service
          push: true
          tags: judyassem0/rowad-auth-user-service:latest

      - name: Build and Push Product Search Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/product-search-service
          push: true
          tags: judyassem0/rowad-product-search-service:latest

      - name: Build and Push Cart Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/cart-service
          push: true
          tags: judyassem0/rowad-cart-service:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/order-service
          push: true
          tags: judyassem0/rowad-order-service:latest

      - name: Build and Push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/payment-service
          push: true
          tags: judyassem0/rowad-payment-service:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: judyassem0/rowad-frontend:latest
